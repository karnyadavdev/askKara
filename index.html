<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskKara — Extraordinary</title>
    <meta name="description" content="A new way to seek knowledge.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="noise"></div>
    <div class="ambient-glow" id="ambientGlow"></div>

    <header class="header">
        <div class="brand" id="brandBtn">kara.</div>
        <div class="header-right">
            <button class="menu-btn" id="menuBtn">HISTORY</button>
            <span class="status-dot"></span>
            <span class="status-text">SYSTEM ONLINE</span>
        </div>
    </header>

    <!-- sidebar for past convos -->
    <aside class="sidebar-panel" id="sidebarPanel">
        <div class="sidebar-header">
            <h3>Past Conversations</h3>
            <button class="close-btn" id="closeSidebarBtn">&times;</button>
        </div>
        <div class="sidebar-content" id="sidebarList">
            <div class="sidebar-item">What is WebGL?</div>
            <div class="sidebar-item">Explain quantum computing simply</div>
            <div class="sidebar-item">How to center a div in CSS</div>
        </div>
    </aside>

    <div class="history-track hidden" id="historyTrack"></div>

    <main class="container">

        <section class="section-landing active" id="viewLanding">
            <div class="hero-wrapper">
                <h1 class="hero-prompt">
                    <span>What do you</span><br>
                    <span class="italic">want to know?</span>
                </h1>

                <div class="input-massive-wrapper">
                    <!-- actual input is invisible, mirror div shows styled text -->
                    <input type="text" id="mainInput" class="input-hidden" autocomplete="off" spellcheck="false">
                    <div class="input-mirror" id="inputMirror">
                        <span class="mirror-text" id="mirrorText"></span>
                        <span class="cursor-blink"></span>
                    </div>
                </div>

                <div class="hint-text" id="hintText">PRESS ENTER TO ASK</div>
            </div>
        </section>

        <section class="section-results" id="viewResults">
            <div class="feed-container" id="feedContainer"></div>

            <div class="followup-wrapper">
                <div class="followup-line">
                    <input type="text" id="followupInput" class="input-followup" placeholder="Dig deeper..."
                        autocomplete="off">
                </div>
            </div>
        </section>

    </main>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">
        <svg class="icon icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg class="icon icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
    </button>

    <!-- load saved theme early to avoid flash -->
    <script>
        (function () {
            var t = localStorage.getItem('kara_theme');
            if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <script src="app.js"></script>
</body>

</html>
